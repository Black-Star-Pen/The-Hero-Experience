# Render Blueprint (https://render.com/docs/blueprint-spec): the API and the
# built front run as a single free web service. The PostgreSQL database is
# hosted elsewhere (Neon): Render's free databases are deleted after 30 days.
services:
  - type: web
    name: the-hero-experience
    runtime: node
    plan: free
    # Same region as the database, close to French-speaking visitors
    region: frankfurt
    branch: main
    # NODE_ENV=production would make npm skip the devDependencies (Vite, TypeScript)
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    # Does not query the database: Neon can scale to zero between visits
    healthCheckPath: /api/health/live
    # Deploys are requested by the CI (deploy hook), once the checks pass
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      # Asked when the Blueprint is created: never commit it
      - key: DATABASE_URL
        sync: false
      # Render's load balancer sets X-Forwarded-For and X-Forwarded-Proto
      - key: TRUST_PROXY
        value: "true"
      # Render is behind Cloudflare, which sets the real client IP in this
      # header (and refuses requests that try to set it): used by the rate
      # limiters, which would otherwise count the requests of a shared proxy
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      # Public demo account, bookings and reviews
      - key: DEMO_DATA
        value: "true"
